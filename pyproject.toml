[build-system]
# setuptools >= 77 is required for the PEP 639 SPDX `license` expression below.
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "OpenGLContext-editor"
dynamic = ["version"]
description = "World-authoring toolkit for OpenGLContext: 3D Tiles octree baker, world generation and editor UI"
readme = "README.md"
license = "BSD-3-Clause"
# The licence file is lowercase, so it does not match setuptools' case-sensitive
# default LICEN[CS]E* glob; name it explicitly so PEP 639 packaging carries it.
license-files = ["license.txt"]
requires-python = ">=3.10"
authors = [
    { name = "Mike C. Fletcher", email = "mcfletch@vrplumber.com" }
]
keywords = [
    "OpenGLContext", "OpenGL", "3D Tiles", "glTF", "tileset", "baker", "octree",
    "terrain", "roads", "editor", "level design", "3D",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
    "Topic :: Multimedia :: Graphics :: 3D Rendering",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

# The engine supplies the glTF/tileset writers a bake emits through and the
# scenegraph an editor session drives; numpy is the whole geometry pipeline.
dependencies = [
    # 3.0.0a3 is the floor rather than 3.0.0a1: this package imports
    # `OpenGLContext.scenegraph.road`, `.roadworks`, `.gantry`, `.props`,
    # `.loaders.gltf.writer` and `.loaders.tiles3d.manifest`, none of which
    # exists in 3.0.0a2. A floor that is lower than what the code imports is a
    # resolver that succeeds and an application that fails on the first import.
    "OpenGLContext>=3.0.0a3",
    "numpy>=2.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "pytest-timeout", "ruff", "mypy"]

[project.scripts]
# Moved to glisteel-editor as `glisteel-bake`: the world it baked is a racing
# circuit, and its options are that world's.  Kept for one release cycle so a
# script that calls it is told where to go.  Removed after that.
oglc-bake = "OpenGLContext_editor.bin.bake:main"

[project.urls]
Homepage = "http://pyopengl.sourceforge.net/context/"
Repository = "https://github.com/mcfletch/openglcontext-editor"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "OpenGLContext_editor.__version__" }

[tool.setuptools.package-data]
OpenGLContext_editor = ["py.typed"]

# The engine's E/W/F/B base, plus import-order, pyupgrade and blind-except.
# Nothing here predates the stricter set, so it is adopted from the first commit
# rather than left as drift to clean up later.
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "B",    # flake8-bugbear
    "I",    # import ordering
    "UP",   # pyupgrade (f-strings, modern typing)
    "BLE",  # no blind except (broad catches must be justified)
    "S110", # no silent try/except/pass
]
ignore = [
    "E501",   # line too long -- kept readable by hand, not hard-wrapped (as in the engine)
    "E741",   # ambiguous name -- x/y/z read naturally as coordinates here
    "UP031",  # percent formatting -- OpenGLContext uses it throughout, and this
              # package is read alongside it; one style across the pair is worth
              # more than the newer syntax in this one
]

[tool.mypy]
# Matches the interpreter the stack is developed and tested against. The shipped
# numpy stubs use syntax that only parses under 3.12, so a lower value here does
# not check an older Python -- it aborts on numpy's own stub before checking
# anything at all.
python_version = "3.12"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
# A greenfield package, so the annotation bar the workspace asks of new code is
# enforced by the checker rather than by review.
disallow_untyped_defs = true

# numpy arithmetic is typed to return `Any` in the shipped stubs, so
# `warn_return_any` fires on nearly every array-returning function in the
# geometry under `world/` and buries the genuine type errors among them. Off for
# that package only, exactly as the engine does for `OpenGLContext.physics.*`;
# every other check -- argument types, optionals, attributes -- stays on.
[[tool.mypy.overrides]]
module = "OpenGLContext_editor.world.*"
warn_return_any = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
# Backstop so a single hung bake or GL smoke test cannot wedge a session.
timeout = 300

# These environments resolve the toolkit's dependencies from an index, so they
# build only once the versions `[project] dependencies` names are published --
# between releases OpenGLContext's exists in this checkout and nowhere else,
# and uv answers "not available" whatever `pip_pre` says. What holds this
# project to its declared gates in the meantime is `tools/preflight.py` in the
# workspace above, which installs every checkout into one environment and runs
# ruff, mypy and the suite there.
[tool.tox]
env_list = ["py310", "py311", "py312", "py313", "py314"]

[tool.tox.env_run_base]
extras = ["dev"]
# OpenGLContext and its stack publish pre-release versions, which uv/pip skip by
# default; without this the resolver reports them "not available".
pip_pre = true
commands = [["pytest", { replace = "posargs", extend = true }]]

# uv decides whether its cached metadata for a source tree is still current
# from pyproject.toml, setup.py and setup.cfg alone. This project's version
# lives in src/OpenGLContext_editor/__init__.py, so name that file too: without
# it a version bump leaves uv answering with the previous number, and a
# dependent requiring the new one resolves against PyPI rather than this
# checkout.
[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "src/OpenGLContext_editor/__init__.py" }]
