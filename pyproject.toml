[build-system]
# setuptools >= 77 is required for the PEP 639 SPDX `license` expression below.
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "OpenGLContext-editor"
dynamic = ["version"]
description = "World-authoring toolkit for OpenGLContext: 3D Tiles octree baker, world generation and editor UI"
readme = "README.md"
license = "BSD-3-Clause"
# The licence file is lowercase, so it does not match setuptools' case-sensitive
# default LICEN[CS]E* glob; name it explicitly so PEP 639 packaging carries it.
license-files = ["license.txt"]
requires-python = ">=3.10"
authors = [
    { name = "Mike C. Fletcher", email = "mcfletch@vrplumber.com" }
]
keywords = [
    "OpenGLContext", "OpenGL", "3D Tiles", "glTF", "tileset", "baker", "octree",
    "terrain", "roads", "editor", "level design", "3D",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
    "Topic :: Multimedia :: Graphics :: 3D Rendering",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

# The engine supplies the glTF/tileset writers a bake emits through and the
# scenegraph an editor session drives; numpy is the whole geometry pipeline.
dependencies = [
    # The floor is above 3.0.0a2: this package imports
    # `OpenGLContext.scenegraph.road`, `.roadworks`, `.gantry`, `.props`,
    # `.loaders.gltf.writer` and `.loaders.tiles3d.manifest`, none of which
    # exists there. A floor lower than what the code imports is a resolver that
    # succeeds and an application that fails on the first import. 3.0.0a4 is
    # the next release after a2 -- there is no published a3 -- and the
    # pre-release is named because an installer skips one it was not asked for.
    #
    # `gltf` is the loader and writer a bake reads and writes tilesets through.
    "OpenGLContext[gltf]>=3.0.0a5",
    "numpy>=2.0",
    # The reducer `meshlod` builds a chain with, and the weld and
    # point-to-triangle projection a bake is built on. A core dependency
    # because making levels of detail is what this package does; the engine
    # draws them and needs none of it. 0.2.0a1 is the first version to carry
    # `certify.nearest_triangle`, which `assets.rewrap` projects through.
    "opengl_decimate>=0.2.0a1",
    # The zone bake makes an area's ambience with `synth.surf` and
    # `synth.birdsong`, which 0.4.0a1 is the first version to carry.
    "omi_audio>=0.4.0a1",
    # The Blender add-on's version is read from its TOML manifest; tomllib
    # is in the standard library from 3.11.
    "tomli>=1.1; python_version < '3.11'",
]

[project.optional-dependencies]
# `assets.rewrap` gives a reduced mesh an atlas of its own. xatlas is MIT and
# ships wheels for CPython and PyPy alike, but it is a bake step -- nothing a
# game runs imports it -- so it is asked for rather than installed by default.
rewrap = ["xatlas>=0.0.9"]
dev = [
    # The rewrap suite needs the unwrapper it is testing; without it those
    # cases skip, and a skipped case is not a gate.
    "xatlas>=0.0.9",
    # Nothing in this package opens a GL context, so the backend is not a
    # runtime dependency -- but `test_bake_renders` runs `oglc-view` over a
    # world it has just baked, and the viewer needs one. Without it the
    # engine's script starts, finds no registered backend it can import, and
    # the case fails on a stderr about installing glfw.
    "OpenGLContext[glfw]",
    "pytest", "pytest-cov", "pytest-timeout", "ruff", "mypy",
]

[project.scripts]
# Moved to glisteel-editor as `glisteel-bake`: the world it baked is a racing
# circuit, and its options are that world's.  Kept for one release cycle so a
# script that calls it is told where to go.  Removed after that.
oglc-bake = "OpenGLContext_editor.bin.bake:main"

# Published plant models into the ground cover a world grows. Authoring: an
# editor runs this once and the baked files are what ship.
oglc-bake-plants = "OpenGLContext_editor.bin.plants:main"

# The level-of-detail demo world: fetch the CC0 art, build the gallery in
# Blender, export the glB with MSFT_lod on every bust.  Needs Blender on the
# path; see docs/blender.md.
oglce-gallery = "OpenGLContext_editor.bin.gallery:main"

[project.urls]
Homepage = "http://pyopengl.sourceforge.net/context/"
Repository = "https://github.com/mcfletch/openglcontext-editor"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "OpenGLContext_editor.__version__" }

[tool.setuptools.package-data]
# The Blender add-on is installed into Blender as a directory, manifest and
# all, so every file of it is package data.
OpenGLContext_editor = ["py.typed", "blender/openglcontext_lod/*.toml"]

# The engine's E/W/F/B base, plus import-order, pyupgrade and blind-except.
# Nothing here predates the stricter set, so it is adopted from the first commit
# rather than left as drift to clean up later.
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "B",    # flake8-bugbear
    "I",    # import ordering
    "UP",   # pyupgrade (f-strings, modern typing)
    "BLE",  # no blind except (broad catches must be justified)
    "S110", # no silent try/except/pass
    "PGH003", "PGH004",  # a type: ignore or noqa names the codes it silences
    "PLE0604", "PLE0605",  # __all__ is a list or tuple of strings
]
ignore = [
    "E501",   # line too long -- kept readable by hand, not hard-wrapped (as in the engine)
    "E741",   # ambiguous name -- x/y/z read naturally as coordinates here
    "UP031",  # percent formatting -- OpenGLContext uses it throughout, and this
              # package is read alongside it; one style across the pair is worth
              # more than the newer syntax in this one
]

[tool.mypy]
# Matches the interpreter the stack is developed and tested against. The shipped
# numpy stubs use syntax that only parses under 3.12, so a lower value here does
# not check an older Python -- it aborts on numpy's own stub before checking
# anything at all.
python_version = "3.12"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
# A greenfield package, so the annotation bar the workspace asks of new code is
# enforced by the checker rather than by review.
disallow_untyped_defs = true

# numpy arithmetic is typed to return `Any` in the shipped stubs, so
# `warn_return_any` fires on nearly every array-returning function in the
# geometry under `world/` and buries the genuine type errors among them. Off for
# that package only, exactly as the engine does for `OpenGLContext.physics.*`;
# every other check -- argument types, optionals, attributes -- stays on.
[[tool.mypy.overrides]]
module = "OpenGLContext_editor.world.*"
warn_return_any = false

# The Blender add-on's `bpy` half. These modules run inside Blender's own
# Python against an API that is not installed here and has no stubs, and
# Blender declares an operator's properties with `levels: IntProperty(...)` --
# a call in annotation position, which is not a type and cannot be made into
# one. Checking them here reports the idiom rather than a defect.
#
# The add-on's other half carries no Blender and *is* checked: `msftlod` (what
# a chain becomes in a document), `gallery` (where the room's parts go) and
# `content` (which files a material is built from) are where its logic lives,
# which is why they are kept free of `bpy` in the first place.
[[tool.mypy.overrides]]
module = [
    "OpenGLContext_editor.blender.openglcontext_lod",
    "OpenGLContext_editor.blender.openglcontext_lod.exporter",
    "OpenGLContext_editor.blender.openglcontext_lod.ops",
    "OpenGLContext_editor.blender.openglcontext_lod.scene",
]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# The engine ships its GL fixtures as a pytest plugin (`gl_context`, `gl_window`);
# `meshlod.quality` measures a level by rendering it, so its cases ask for one.
addopts = "-ra -p OpenGLContext.testing.plugin"
# Backstop so a single hung bake or GL smoke test cannot wedge a session.
timeout = 300
markers = [
    # Runs a headless Blender, which is a separate application rather than a
    # dependency: these cases run where one is on the path and are skipped
    # where none is.  `-m 'not blender'` leaves them out deliberately.
    "blender: needs a Blender on the path (or $BLENDER)",
]

# These environments resolve the toolkit's dependencies from an index, so they
# build only once the versions `[project] dependencies` names are published --
# between releases OpenGLContext's exists in this checkout and nowhere else,
# and uv answers "not available" whatever `pip_pre` says. What holds this
# project to its declared gates in the meantime is `tools/preflight.py` in the
# workspace above, which installs every checkout into one environment and runs
# ruff, mypy and the suite there.
[tool.tox]
env_list = ["py310", "py311", "py312", "py313", "py314"]

[tool.tox.env_run_base]
extras = ["dev"]
# OpenGLContext and its stack publish pre-release versions, which uv/pip skip by
# default; without this the resolver reports them "not available".
pip_pre = true
# A variable that does not reach the child does not stop the run; it renders
# with something else, or not at all, and reports on a configuration nobody
# asked for. `test_bake_renders` runs `oglc-view` in a subprocess, so what
# reaches this environment is what reaches the renderer.
#
# DISPLAY and XAUTHORITY: under `xvfb-run` the server is named by the first and
# its cookie by the second, and a client arriving without the cookie is refused
# with "Authorization required, but no authorization protocol specified".
# Without either, GLFW reports the display variable missing and the frame is
# never drawn.
passenv = [
    "DISPLAY",
    "XAUTHORITY",
    "XDG_RUNTIME_DIR",
    "WAYLAND_DISPLAY",
    "LIBGL_*",
    "MESA_*",
    "GALLIUM_DRIVER",
    "OPENGLCONTEXT_*",
]
commands = [["pytest", { replace = "posargs", extend = true }]]

# uv decides whether its cached metadata for a source tree is still current
# from pyproject.toml, setup.py and setup.cfg alone. This project's version
# lives in src/OpenGLContext_editor/__init__.py, so name that file too: without
# it a version bump leaves uv answering with the previous number, and a
# dependent requiring the new one resolves against PyPI rather than this
# checkout.
[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "src/OpenGLContext_editor/__init__.py" }]
